<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b10" />
    <title>Aircade</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0b10;
        --card: #16161f;
        --line: #2a2a38;
        --text: #f2f0ea;
        --muted: #8b8a99;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 28px;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.3em;
        color: var(--muted);
        text-align: center;
      }
      nav { display: grid; gap: 14px; width: min(360px, calc(100vw - 32px)); }
      a {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 22px 22px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s, transform 0.15s;
      }
      a:hover, a:focus-visible { border-color: var(--muted); transform: translateY(-1px); outline: none; }
      a strong { font-size: 22px; font-weight: 600; }
      a span { font-size: 13px; color: var(--muted); letter-spacing: 0.05em; }
    </style>
  </head>
  <body>
    <h1>AIRCADE</h1>
    <nav>
      <a href="sweeper/"><strong>地牢扫雷</strong><span>Dungeon Sweeper</span></a>
      <a href="battle/"><strong>行囊对决</strong><span>Pack Battle</span></a>
    </nav>
  </body>
</html>
