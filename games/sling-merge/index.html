<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFE4EE" />
    <meta name="description" content="弹个大西瓜 · SLING MERGE —— 把合成大西瓜倒进一罐冒泡的汽水里，用糖果弹弓把 Q 弹水果射上去！" />
    <title>弹个大西瓜 · Sling Merge</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='24' fill='%233DD681' stroke='%2313864A' stroke-width='4'/%3E%3Cpath d='M20 16l6 8 6-10 6 10 6-8-2 12H22z' fill='%23FFC93C' stroke='%23F2A100' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='38' r='3' fill='%233B2340'/%3E%3Ccircle cx='40' cy='38' r='3' fill='%233B2340'/%3E%3Cpath d='M26 45q6 6 12 0' stroke='%233B2340' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f6e3f3;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 390px;
        height: 844px;
        transform-origin: 0 0;
        background: #fff5e9;
      }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div id="stage">
      <canvas id="game" aria-label="游戏画面：汽水罐与弹弓"></canvas>
      <div id="ui">
        <!-- 标题页：静态 DOM，JS 加载前即可见 -->
        <section id="title" class="screen show" aria-label="标题页">
          <h1 class="logo" aria-label="弹个大西瓜">
            <svg viewBox="0 0 340 84" width="340" height="84" aria-hidden="true"><g class="ch"><text class="sh" x="62" y="60">弹</text><text class="o1" x="62" y="60">弹</text><text class="o2" x="62" y="60">弹</text><text class="f pink" x="62" y="60">弹</text></g><g class="ch"><text class="sh" x="116" y="60">个</text><text class="o1" x="116" y="60">个</text><text class="o2" x="116" y="60">个</text><text class="f pink" x="116" y="60">个</text></g><g class="ch"><text class="sh" x="170" y="60">大</text><text class="o1" x="170" y="60">大</text><text class="o2" x="170" y="60">大</text><text class="f green" x="170" y="60">大</text></g><g class="ch"><text class="sh" x="224" y="60">西</text><text class="o1" x="224" y="60">西</text><text class="o2" x="224" y="60">西</text><text class="f green" x="224" y="60">西</text></g><g class="ch"><text class="sh" x="278" y="60">瓜</text><text class="o1" x="278" y="60">瓜</text><text class="o2" x="278" y="60">瓜</text><text class="f green" x="278" y="60">瓜</text></g></svg>
          </h1>
          <div class="subtitle">SLING MERGE</div>
          <button id="btn-start" class="jelly primary start" type="button">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" /></svg>
            <span>开始游戏</span>
          </button>
          <div class="title-best" id="title-best">
            <svg class="ico crown" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5z" fill="#FFC93C" stroke="#F2A100" stroke-width="1.8" stroke-linejoin="round" /></svg>
            <span>最高分 <b id="title-best-num">0</b></span>
          </div>
          <button id="btn-title-settings" class="jelly round corner-l" type="button" aria-label="设置">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8zm8 4.6v-2.4l-2.3-.5a6 6 0 0 0-.7-1.6l1.3-2-1.7-1.7-2 1.3a6 6 0 0 0-1.6-.7L12.5 3h-2.4l-.5 2.3a6 6 0 0 0-1.6.7l-2-1.3-1.7 1.7 1.3 2a6 6 0 0 0-.7 1.6L2.6 10.5v2.4l2.3.5c.2.6.4 1.1.7 1.6l-1.3 2 1.7 1.7 2-1.3c.5.3 1 .5 1.6.7l.5 2.3h2.4l.5-2.3c.6-.2 1.1-.4 1.6-.7l2 1.3 1.7-1.7-1.3-2c.3-.5.5-1 .7-1.6z" fill="currentColor" /></svg>
          </button>
          <button id="btn-howto" class="jelly round corner-r" type="button" aria-label="玩法（重看引导）">
            <span class="q">?</span>
          </button>
          <div class="corner-label l">设置</div>
          <div class="corner-label r">玩法</div>
        </section>
      </div>
      <canvas id="wave" aria-hidden="true"></canvas>
    </div>
    <script>
      // 首帧前先把舞台缩放到位（stage.ts 之后接管）
      (function () {
        var vw = window.innerWidth, vh = window.innerHeight;
        var s = Math.min(vw / 390, vh / 844, 1.25);
        var l = Math.round((vw - 390 * s) / 2), t = Math.round((vh - 844 * s) / 2);
        var st = document.getElementById('stage');
        st.style.transform = 'translate(' + l + 'px,' + t + 'px) scale(' + s + ')';
        try {
          var b = localStorage.getItem('aircade.sling-merge.best');
          if (b) document.getElementById('title-best-num').textContent = Number(b).toLocaleString('en-US');
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
